<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>Niyantri Cafe - Contact Us</title>
  <meta name='description' content='Get in touch with Niyantri Cafe for inquiries, events, or reservations.'>
  <script src='https://cdn.tailwindcss.com'></script>
</head>
<body class='bg-white text-gray-800 font-sans'>
  <!-- Navigation -->
  <header>
    <nav class='bg-white shadow sticky top-0 z-50'>
      <div class='max-w-7xl mx-auto px-4 sm:px-6 lg:px-8'>
        <div class='flex justify-between items-center h-16'>
          <div class='flex-shrink-0'>
            <a href='index.html' class='text-2xl font-bold text-gray-800'>Niyantri Cafe</a>
          </div>
          <div class='hidden md:block'>
            <div class='ml-10 flex items-baseline space-x-4'>
              <a href='index.html' class='px-3 py-2 text-sm font-medium text-gray-700 hover:text-gray-900'>Home</a>
              <a href='menu.html' class='px-3 py-2 text-sm font-medium text-gray-700 hover:text-gray-900'>Menu</a>
              <a href='about.html' class='px-3 py-2 text-sm font-medium text-gray-700 hover:text-gray-900'>About</a>
              <a href='contact.html' class='px-3 py-2 text-sm font-medium text-gray-700 hover:text-gray-900'>Contact</a>
            </div>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <main class='max-w-4xl mx-auto px-4 py-16'>
    <section class='mb-8'>
      <h1 class='text-3xl font-semibold font-[Montserrat] mb-2'>Contact Us</h1>
      <p class='text-gray-700'>Have a question or want to book a private event? Send us a message and we’ll get back to you soon.</p>
    </section>
    <form class='bg-white shadow rounded-lg p-6' action='#' method='post'>
      <div class='grid grid-cols-1 md:grid-cols-2 gap-4'>
        <div>
          <label for='name' class='block text-sm font-medium text-gray-700'>Name</label>
          <input type='text' id='name' name='name' required class='mt-1 w-full border rounded-md px-3 py-2' placeholder='Your name'>
        </div>
        <div>
          <label for='email' class='block text-sm font-medium text-gray-700'>Email</label>
          <input type='email' id='email' name='email' required class='mt-1 w-full border rounded-md px-3 py-2' placeholder='you@example.com'>
        </div>
      </div>
      <div class='mt-4'>
        <label for='message' class='block text-sm font-medium text-gray-700'>Message</label>
        <textarea id='message' name='message' required rows='4' class='mt-1 w-full border rounded-md px-3 py-2' placeholder='How can we help?'></textarea>
      </div>
      <div class='mt-4'>
        <button type='submit' class='bg-[#D2B48C] text-[#3C2415] px-6 py-3 rounded-full font-semibold hover:bg-[#c89f6f] transition-all duration-300'>Send Message</button>
      </div>
    </form>
  </main>
</body>
</html>
